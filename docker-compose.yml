services:
  portfolio:
    image: ghcr.io/itsxianzhing/portfolio-tatan:latest
    container_name: portfolio-tatan
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true
